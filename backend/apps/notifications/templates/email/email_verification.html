<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Verify your email</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h1 style="color: #1a1a2e;">Verify your email address</h1>
  <p>Hi {{ user.first_name }}, click the button below to verify your email.</p>
  <a href="{{ verification_url }}"
     style="background: #4f46e5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block; margin: 16px 0;">
    Verify Email
  </a>
  <p style="color: #888; font-size: 12px;">This link expires in 24 hours. If you didn't create an account, ignore this email.</p>
</body>
</html>
