<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Reset your password</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h1 style="color: #1a1a2e;">Reset your password</h1>
  <p>Hi {{ user.first_name }}, we received a request to reset your password.</p>
  <a href="{{ reset_url }}"
     style="background: #4f46e5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block; margin: 16px 0;">
    Reset Password
  </a>
  <p style="color: #888; font-size: 12px;">This link expires in 1 hour. If you didn't request a reset, ignore this email.</p>
</body>
</html>
